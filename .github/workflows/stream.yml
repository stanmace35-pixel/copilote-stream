name: Copilote - enregistrement des lives

# Dépôt public : minutes GitHub Actions illimitées. Aucune donnée ici, seulement le code ;
# les clés restent dans les secrets du dépôt.
on:
  schedule:
    - cron: "50 16 * * *"   # 17h50 heure de Paris (hiver) : avant le live de 18h
    - cron: "40 22 * * *"   # reprise si le live dure toute la nuit
  workflow_dispatch:

concurrency:
  group: stream
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund tiktok-live-connector@2
      - name: Suivre Twitch et TikTok
        env:
          SUPABASE_URL: https://aptevdhteyujddbztdmk.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWITCH_CLIENT_ID: mwkl8ta1nxzy8u4rvissogirb3jdo7
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_LOGIN: tansonrp
          TIKTOK_USERNAME: tansorp
          WAIT_MINUTES: ${{ github.event.schedule == '40 22 * * *' && '20' || '90' }}
        run: node collect/stream.mjs
